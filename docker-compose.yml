# =============================================================================
# 3DGRUT API — Docker Compose
#
# First time:
#   cp .env.example .env && vim .env
#   docker compose build
#   docker compose up -d
#
# After code changes (no rebuild needed):
#   git pull && docker compose restart
#
# Logs:
#   docker compose logs -f
#
# Swagger UI:
#   http://localhost:8191/docs
# =============================================================================

services:
  3dgrut-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAX_JOBS: "${MAX_JOBS:-4}"
        http_proxy: "${HTTP_PROXY:-}"
        https_proxy: "${HTTPS_PROXY:-}"
        no_proxy: "${NO_PROXY:-localhost,127.0.0.1}"

    container_name: 3dgrut-api

    ports:
      - "${THREEDGRUT_PORT:-8191}:8191"

    volumes:
      # Mount API source code — changes take effect on restart, no rebuild
      - ./api:/workspace/api:ro
      # Mount tracer fixes (JIT module loading)
      - ./threedgut_tracer:/workspace/threedgut_tracer:ro
      - ./threedgrt_tracer:/workspace/threedgrt_tracer:ro
      - ./threedgrut:/workspace/threedgrut:ro
      - ./threedgrut_playground:/workspace/threedgrut_playground:ro
      # Persistent job data
      - ${THREEDGRUT_DATA_PATH:-./data}:/workspace/data:rw
      # HuggingFace model cache
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/hf_cache:rw
      # Logs
      - ./logs:/workspace/logs:rw

    environment:
      - HF_HOME=/hf_cache
      - THREEDGRUT_DATA_DIR=/workspace/data
      - THREEDGRUT_LOG_DIR=/workspace/logs
      - THREEDGRUT_PORT=8191
      - THREEDGRUT_HOST=0.0.0.0
      - THREEDGRUT_MAX_GPU_JOBS=${THREEDGRUT_MAX_GPU_JOBS:-1}
      - HYDRA_FULL_ERROR=1
      # Runtime proxy
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${THREEDGRUT_GPU_ID:-0}"]
              capabilities: [gpu]

    shm_size: "8gb"
    restart: unless-stopped
